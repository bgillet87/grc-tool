  function progKey() { return 'grc-fieldguide-progress'; }
  function loadProgress() {
    try { return JSON.parse(localStorage.getItem(progKey()) || '{}'); } catch (e) { return {}; }
  }
  function saveProgress(p) { try { localStorage.setItem(progKey(), JSON.stringify(p)); } catch (e) {} }

  let currentTopicId = null;

  function topicScore(topicId) {
    const prog = loadProgress()[topicId];
    if (!prog || !prog.checked) return null;
    const checkedCount = Object.keys(prog.checked).length;
    if (checkedCount === 0) return null;
    const topic = TOPICS.find(function(t) { return t.id === topicId; });
    let correct = 0;
    Object.keys(prog.checked).forEach(function(qi) {
      if (prog.answers[qi] === topic.quiz[qi].correct) correct++;
    });
    return { correct: correct, total: topic.quiz.length, attempted: checkedCount };
  }

  function overallProgress() {
    let done = 0;
    TOPICS.forEach(function(t) {
      const s = topicScore(t.id);
      if (s && s.attempted === t.quiz.length) done++;
    });
    return { done: done, total: TOPICS.length };
  }

  function render() {
    if (currentTopicId) renderTopic(); else renderGrid();
  }

  function renderGrid() {
    const overall = overallProgress();
    let html = '<div class="wizard-head"><h2>Field Guide</h2></div>' +
      '<p class="guide-intro">Short, practical primers on how auditors actually think — written for using this tool, not for passing a proctored exam. Each topic ends with a quick self-check.</p>' +
      '<div class="guide-progress-bar"><div class="guide-progress-fill" style="width:' + Math.round((overall.done / overall.total) * 100) + '%"></div></div>' +
      '<p style="font-size:11.5px;color:var(--steel);margin:6px 0 0;">' + overall.done + ' of ' + overall.total + ' topics completed</p>' +
      '<div class="guide-grid">';
    TOPICS.forEach(function(t, idx) {
      const s = topicScore(t.id);
      let statusHtml = '<span class="g-status">Not started</span>';
      if (s) {
        const cls = s.correct === s.total ? 'done' : 'partial';
        statusHtml = '<span class="g-status ' + cls + '">' + s.correct + '/' + s.total + ' correct</span>';
      }
      html += '<div class="guide-card" data-id="' + t.id + '">' +
        '<span class="g-num">' + String(idx + 1).padStart(2, '0') + '</span>' +
        '<h3>' + t.title + '</h3>' +
        '<p>' + t.teaser + '</p>' +
        statusHtml +
        '</div>';
    });
    html += '</div>';
    document.getElementById('page-fieldguide').innerHTML = html;
    document.querySelectorAll('.guide-card').forEach(function(card) {
      card.addEventListener('click', function() { currentTopicId = card.getAttribute('data-id'); render(); });
    });
  }

  function renderTopic() {
    const topic = TOPICS.find(function(t) { return t.id === currentTopicId; });
    const idx = TOPICS.indexOf(topic);
    const prog = loadProgress();
    const tProg = prog[topic.id] || { answers: {}, checked: {} };

    let bodyHtml = topic.body.map(function(p) { return '<p>' + p + '</p>'; }).join('');

    let quizHtml = '<div class="quiz-block"><h3>Self-check</h3>';
    topic.quiz.forEach(function(q, qi) {
      const checked = tProg.checked[qi];
      const selected = tProg.answers[qi];
      quizHtml += '<div class="quiz-q" data-qi="' + qi + '"><div class="q-text">' + (qi + 1) + '. ' + q.q + '</div>';
      q.options.forEach(function(opt, oi) {
        let cls = 'quiz-option';
        if (checked !== undefined) {
          if (oi === q.correct) cls += ' correct';
          else if (oi === selected) cls += ' incorrect';
        }
        quizHtml += '<label class="' + cls + '"><input type="radio" name="q' + qi + '" value="' + oi + '"' + (selected === oi ? ' checked' : '') + (checked !== undefined ? ' disabled' : '') + '> ' + opt + '</label>';
      });
      if (checked === undefined) {
        quizHtml += '<div><button class="quiz-check" data-qi="' + qi + '" type="button">Check answer</button></div>';
      } else {
        const isCorrect = selected === q.correct;
        quizHtml += '<div class="quiz-feedback ' + (isCorrect ? 'correct' : 'incorrect') + '">' +
          (isCorrect ? 'Correct. ' : 'Not quite. ') + (q.explain || '') + '</div>';
      }
      quizHtml += '</div>';
    });
    const score = topicScore(topic.id);
    if (score && score.attempted === topic.quiz.length) {
      quizHtml += '<div class="quiz-score">' + score.correct + ' of ' + score.total + ' correct.</div>';
    }
    quizHtml += '</div>';

    const nextTopic = TOPICS[idx + 1];

    document.getElementById('page-fieldguide').innerHTML =
      '<div class="wizard-head">' +
        '<button class="back-link" id="backToGuide" type="button">‹ Field Guide</button>' +
        '<h2>' + topic.title + '</h2>' +
      '</div>' +
      '<div class="topic-body">' + bodyHtml + '</div>' +
      quizHtml +
      (nextTopic ? '<div class="wizard-nav-buttons" style="border-top:none;justify-content:flex-end;"><button class="btn-primary" id="nextTopic" type="button">Next: ' + nextTopic.title + '</button></div>' : '');

    document.getElementById('backToGuide').addEventListener('click', function() { currentTopicId = null; render(); });
    if (nextTopic) {
      document.getElementById('nextTopic').addEventListener('click', function() { currentTopicId = nextTopic.id; render(); });
    }
    document.querySelectorAll('.quiz-check').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const qi = btn.getAttribute('data-qi');
        const selectedInput = document.querySelector('input[name="q' + qi + '"]:checked');
        if (!selectedInput) return;
        const p = loadProgress();
        p[topic.id] = p[topic.id] || { answers: {}, checked: {} };
        p[topic.id].answers[qi] = parseInt(selectedInput.value, 10);
        p[topic.id].checked[qi] = true;
        saveProgress(p);
        render();
      });
    });
  }

  window.GRCFieldGuide = { init: function() { render(); } };
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').catch(function() {});
  });
}
</script>
