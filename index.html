<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Control Register">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef0ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171d22" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --ink: #1c2b39;
    --paper: #eef0ea;
    --paper-raised: #e2e5da;
    --rule: #c7ccbc;
    --steel: #57636f;
    --ochre: #b8802f;
    --ochre-bg: #f3e6d2;
    --forest: #3f6b4a;
    --forest-bg: #dfe8e0;
    --rust: #9c3d2e;
    --rust-bg: #ecdcd6;
    --slate-bg: #dde1da;
    --focus: #2f6fa8;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #e8ebe3;
      --paper: #171d22;
      --paper-raised: #1f262c;
      --rule: #333d40;
      --steel: #9aa7ac;
      --ochre: #d9a256;
      --ochre-bg: #3a2f1c;
      --forest: #7fb08d;
      --forest-bg: #1f3227;
      --rust: #d98a78;
      --rust-bg: #3a2420;
      --slate-bg: #232b2f;
      --focus: #6fa8d8;
    }
  }
  :root[data-theme="dark"] {
      --ink: #e8ebe3;
      --paper: #171d22;
      --paper-raised: #1f262c;
      --rule: #333d40;
      --steel: #9aa7ac;
      --ochre: #d9a256;
      --ochre-bg: #3a2f1c;
      --forest: #7fb08d;
      --forest-bg: #1f3227;
      --rust: #d98a78;
      --rust-bg: #3a2420;
      --slate-bg: #232b2f;
      --focus: #6fa8d8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--ochre-bg); }
  .app { max-width: 1180px; margin: 0 auto; padding: 0 20px 60px; }

  header.top {
    padding: 22px 0 16px;
    border-bottom: 1px solid var(--rule);
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
  }
  .brand h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }
  .brand p { margin: 0; color: var(--steel); font-size: 13px; }
  .theme-toggle {
    background: none; border: 1px solid var(--rule); color: var(--steel);
    border-radius: 3px; padding: 5px 10px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .theme-toggle:hover { border-color: var(--steel); }

  .framework-bar {
    display: flex; align-items: center; gap: 4px; margin-top: 18px;
    border-bottom: 1px solid var(--rule); flex-wrap: wrap; row-gap: 4px;
  }
  .fw-badge {
    display: inline-block; font-family: 'IBM Plex Mono', monospace; font-size: 9.5px;
    padding: 1px 6px; border-radius: 3px; margin-right: 6px; color: #fff; vertical-align: middle;
  }
  .fw-badge.iso27001 { background: var(--steel); }
  .fw-badge.pipeda { background: var(--ochre); }
  .fw-badge.nist-privacy { background: var(--forest); }
  .fw-badge.itsg33 { background: var(--focus); }
  .fw-tab {
    background: none; border: none; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px; color: var(--steel); padding: 10px 4px; margin-right: 22px;
    border-bottom: 2px solid transparent; position: relative; top: 1px;
  }
  .fw-tab.active { color: var(--ink); border-bottom-color: var(--ochre); font-weight: 500; }

  .dash {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px;
    background: var(--rule); border: 1px solid var(--rule); margin: 20px 0;
  }
  .dash-cell { background: var(--paper); padding: 14px 16px; }
  .dash-cell .num { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; display: block; }
  .dash-cell .lbl { font-size: 11.5px; color: var(--steel); text-transform: uppercase; letter-spacing: 0.04em; }
  .dash-cell.met .num { color: var(--forest); }
  .dash-cell.gap .num { color: var(--ochre); }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .toolbar input[type="search"] {
    flex: 1; min-width: 180px; padding: 9px 12px; border: 1px solid var(--rule);
    background: var(--paper-raised); color: var(--ink); border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace; font-size: 13px;
  }
  .toolbar select {
    padding: 9px 10px; border: 1px solid var(--rule); background: var(--paper-raised);
    color: var(--ink); border-radius: 3px; font-family: inherit; font-size: 13px;
  }
  .toolbar button.action {
    padding: 9px 14px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
    border-radius: 3px; font-family: inherit; font-size: 13px; cursor: pointer;
  }
  .toolbar button.action.secondary { background: none; color: var(--ink); }
  .toolbar button.action:hover { opacity: 0.85; }

  .theme-rail { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
  .theme-chip {
    border: 1px solid var(--rule); background: var(--paper-raised); color: var(--steel);
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; cursor: pointer;
  }
  .theme-chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .register { border-top: 1px solid var(--rule); }
  .row {
    border-bottom: 1px solid var(--rule);
    display: grid;
    grid-template-columns: 74px 1fr 130px 22px;
    align-items: center;
    gap: 12px;
    padding: 12px 4px;
    cursor: pointer;
    border-left: 3px solid transparent;
  }
  .row:hover { background: var(--paper-raised); }
  .row .cid { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--steel); }
  .row .ctitle { font-size: 14px; }
  .row .ctitle .theme-label { display: block; font-size: 11px; color: var(--steel); margin-top: 2px; }
  .row .chev { text-align: right; color: var(--steel); transition: transform 0.15s ease; }
  .row.open .chev { transform: rotate(90deg); }

  .status-pill {
    font-size: 11px; padding: 3px 9px; border-radius: 999px; text-align: center;
    white-space: nowrap; font-weight: 500;
  }
  .status-pill.not-started { background: var(--slate-bg); color: var(--steel); }
  .status-pill.in-progress { background: var(--ochre-bg); color: var(--ochre); }
  .status-pill.implemented { background: var(--forest-bg); color: var(--forest); }
  .status-pill.not-applicable { background: var(--rust-bg); color: var(--rust); }

  .row.not-started { border-left-color: var(--rule); }
  .row.in-progress { border-left-color: var(--ochre); }
  .row.implemented { border-left-color: var(--forest); }
  .row.not-applicable { border-left-color: var(--rust); }

  .detail {
    display: none; padding: 4px 4px 20px 4px; border-bottom: 1px solid var(--rule);
    background: var(--paper-raised);
  }
  .detail.open { display: block; }
  .detail-inner { padding: 12px 12px 4px; max-width: 760px; }
  .detail p.desc { margin: 0 0 10px; font-size: 13.5px; color: var(--ink); }
  .detail p.guidance { margin: 0 0 16px; font-size: 12.5px; color: var(--steel); }
  .detail p.guidance:before { content: "Where to look — "; font-weight: 500; color: var(--steel); }
  .field-row { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 14px; }
  .field { flex: 1; min-width: 180px; }
  .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--steel); margin-bottom: 5px; }
  .field select, .field input[type="date"] {
    width: 100%; padding: 7px 9px; border: 1px solid var(--rule); background: var(--paper);
    color: var(--ink); border-radius: 3px; font-family: inherit; font-size: 13px;
  }
  .field textarea {
    width: 100%; min-height: 64px; padding: 8px 9px; border: 1px solid var(--rule);
    background: var(--paper); color: var(--ink); border-radius: 3px; font-family: inherit;
    font-size: 13px; resize: vertical;
  }
  .saved-tick { font-size: 11px; color: var(--forest); margin-left: 8px; opacity: 0; transition: opacity 0.3s; }
  .saved-tick.show { opacity: 1; }

  footer.appfoot { margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--steel); font-size: 12px; }
  .appfoot-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .appfoot-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .appfoot-actions button { padding: 5px 10px; font-size: 11.5px; }

  @media (max-width: 640px) {
    .row { grid-template-columns: 56px 1fr 20px; }
    .row .status-pill { display: none; }
    .row.not-started .chev, .row.in-progress .chev { color: var(--steel); }
    .dash { grid-template-columns: repeat(2, 1fr); }
  }

  @media print {
    .toolbar, .theme-toggle, .theme-rail, header .fw-tab:not(.active), .row .chev, .page-nav, .wizard-nav-buttons { display: none !important; }
    .detail { display: block !important; }
    body { background: #fff; color: #000; }
  }

  .page-nav { display: flex; gap: 22px; margin-top: 16px; }
  .page-nav button {
    background: none; border: none; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14.5px; color: var(--steel); padding: 8px 0 12px; border-bottom: 2px solid transparent;
  }
  .page-nav button.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 500; }

  .doctype-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin-top: 20px; }
  .doctype-card { background: var(--paper); padding: 18px 18px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
  .doctype-card:hover { background: var(--paper-raised); }
  .doctype-card .dt-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ochre); text-transform: uppercase; letter-spacing: 0.03em; }
  .doctype-card h3 { font-family: 'Fraunces', serif; font-size: 17px; margin: 0; font-weight: 600; }
  .doctype-card p { margin: 0; font-size: 12.5px; color: var(--steel); flex: 1; }
  .doctype-card .dt-status { font-size: 11.5px; color: var(--forest); margin-top: 4px; }

  .wizard-head { margin: 24px 0 6px; }
  .wizard-head .back-link { background: none; border: none; color: var(--steel); font-size: 12.5px; cursor: pointer; padding: 0; margin-bottom: 10px; }
  .wizard-head h2 { font-family: 'Fraunces', serif; font-size: 22px; margin: 0 0 4px; }
  .wizard-progress { font-size: 12px; color: var(--steel); font-family: 'IBM Plex Mono', monospace; margin-bottom: 18px; }
  .wizard-bar { height: 3px; background: var(--rule); margin-bottom: 24px; }
  .wizard-bar-fill { height: 100%; background: var(--ochre); transition: width 0.2s ease; }

  .wizard-section h3 { font-family: 'Fraunces', serif; font-size: 18px; margin: 0 0 16px; }
  .w-field { margin-bottom: 18px; max-width: 640px; }
  .w-field label { display: block; font-size: 12.5px; color: var(--steel); margin-bottom: 6px; }
  .w-field input[type="text"], .w-field input[type="date"], .w-field select, .w-field textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--rule); background: var(--paper-raised);
    color: var(--ink); border-radius: 3px; font-family: inherit; font-size: 13.5px;
  }
  .w-field textarea { min-height: 84px; resize: vertical; }

  .w-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .w-table th { text-align: left; font-size: 11px; color: var(--steel); text-transform: uppercase; letter-spacing: 0.02em; padding: 0 8px 6px 0; border-bottom: 1px solid var(--rule); }
  .w-table td { padding: 4px 8px 4px 0; vertical-align: top; }
  .w-table input, .w-table select { width: 100%; padding: 6px 8px; border: 1px solid var(--rule); background: var(--paper-raised); color: var(--ink); border-radius: 3px; font-family: inherit; font-size: 12.5px; }
  .w-table .rm-row { background: none; border: none; color: var(--rust); cursor: pointer; font-size: 15px; padding: 4px; }
  .w-add-row { border: 1px dashed var(--rule); background: none; color: var(--steel); padding: 7px 12px; border-radius: 3px; cursor: pointer; font-size: 12.5px; margin-bottom: 20px; }

  .wizard-nav-buttons { display: flex; justify-content: space-between; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--rule); }
  .wizard-nav-buttons button { padding: 9px 16px; border-radius: 3px; font-family: inherit; font-size: 13.5px; cursor: pointer; }
  .btn-primary { background: var(--ink); color: var(--paper); border: 1px solid var(--ink); }
  .btn-ghost { background: none; color: var(--ink); border: 1px solid var(--rule); }

  .soa-table-wrap { max-height: 480px; overflow-y: auto; border: 1px solid var(--rule); margin-bottom: 10px; }
  .soa-row { display: grid; grid-template-columns: 62px 1fr 90px 1fr; gap: 10px; padding: 9px 10px; border-bottom: 1px solid var(--rule); align-items: start; font-size: 12.5px; }
  .soa-row .soa-id { font-family: 'IBM Plex Mono', monospace; color: var(--steel); padding-top: 6px; }
  .soa-row .soa-title { padding-top: 6px; }
  .soa-row select { padding: 6px 8px; border: 1px solid var(--rule); background: var(--paper-raised); color: var(--ink); border-radius: 3px; font-family: inherit; font-size: 12px; }
  .soa-row textarea { width: 100%; min-height: 34px; padding: 6px 8px; border: 1px solid var(--rule); background: var(--paper-raised); color: var(--ink); border-radius: 3px; font-family: inherit; font-size: 12px; resize: vertical; }

  .preview-toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0; }
  .doc-preview { background: var(--paper-raised); border: 1px solid var(--rule); padding: 30px 34px; max-width: 760px; }
  .doc-preview h1 { font-family: 'Fraunces', serif; font-size: 22px; margin-top: 0; }
  .doc-preview h2 { font-family: 'Fraunces', serif; font-size: 16.5px; margin-top: 26px; border-top: 1px solid var(--rule); padding-top: 16px; }
  .doc-preview p { font-size: 13.5px; margin: 8px 0; }
  .doc-preview table { border-collapse: collapse; width: 100%; margin: 10px 0 4px; }
  .doc-preview th, .doc-preview td { border: 1px solid var(--rule); padding: 6px 8px; font-size: 12px; text-align: left; vertical-align: top; }
  .doc-preview th { background: var(--slate-bg); }

  .tpl-editor-wrap { margin-top: 18px; }
  .tpl-editor-wrap textarea { width: 100%; min-height: 320px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; padding: 12px; border: 1px solid var(--rule); background: var(--paper-raised); color: var(--ink); border-radius: 3px; }
  .tpl-tokens { font-size: 11.5px; color: var(--steel); margin: 8px 0 14px; font-family: 'IBM Plex Mono', monospace; line-height: 1.7; }
  .tpl-tokens span { background: var(--slate-bg); padding: 1px 5px; border-radius: 2px; margin-right: 4px; }

  .guide-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin-top: 20px; }
  .guide-card { background: var(--paper); padding: 18px 18px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
  .guide-card:hover { background: var(--paper-raised); }
  .guide-card .g-num { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--ochre); }
  .guide-card h3 { font-family: 'Fraunces', serif; font-size: 16.5px; margin: 0; font-weight: 600; }
  .guide-card p { margin: 0; font-size: 12.5px; color: var(--steel); flex: 1; }
  .guide-card .g-status { font-size: 11.5px; margin-top: 4px; }
  .guide-card .g-status.done { color: var(--forest); }
  .guide-card .g-status.partial { color: var(--ochre); }

  .guide-intro { max-width: 640px; color: var(--steel); font-size: 13px; margin: 18px 0 4px; }
  .guide-progress-bar { height: 3px; background: var(--rule); margin: 14px 0 4px; }
  .guide-progress-fill { height: 100%; background: var(--forest); }

  .topic-body { max-width: 680px; }
  .topic-body p { font-size: 14px; line-height: 1.65; margin: 0 0 14px; }
  .topic-body strong { color: var(--ink); }

  .quiz-block { max-width: 680px; margin-top: 28px; border-top: 1px solid var(--rule); padding-top: 20px; }
  .quiz-block h3 { font-family: 'Fraunces', serif; font-size: 17px; margin: 0 0 16px; }
  .quiz-q { margin-bottom: 22px; }
  .quiz-q .q-text { font-size: 13.5px; margin-bottom: 10px; }
  .quiz-option { display: flex; align-items: flex-start; gap: 8px; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 3px; margin-bottom: 6px; cursor: pointer; font-size: 13px; background: var(--paper-raised); }
  .quiz-option:hover { border-color: var(--steel); }
  .quiz-option input { margin-top: 2px; }
  .quiz-option.correct { border-color: var(--forest); background: var(--forest-bg); }
  .quiz-option.incorrect { border-color: var(--rust); background: var(--rust-bg); }
  .quiz-check { padding: 6px 12px; border: 1px solid var(--ink); background: none; color: var(--ink); border-radius: 3px; font-size: 12.5px; cursor: pointer; margin-top: 2px; }
  .quiz-feedback { font-size: 12.5px; margin-top: 8px; padding: 8px 10px; border-radius: 3px; background: var(--slate-bg); color: var(--steel); }
  .quiz-feedback.correct { background: var(--forest-bg); color: var(--forest); }
  .quiz-feedback.incorrect { background: var(--rust-bg); color: var(--rust); }
  .quiz-score { font-size: 13px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--steel); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Control Register</h1>
      <p>Framework audit &amp; evidence tracker</p>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button">Dark mode</button>
  </header>

  <nav class="page-nav" id="pageNav">
    <button data-page="register" class="active" type="button">Control Register</button>
    <button data-page="builder" type="button">Document Builder</button>
    <button data-page="fieldguide" type="button">Field Guide</button>
  </nav>

  <div id="page-register">
    <div class="framework-bar" id="fwBar"></div>

    <div class="dash" id="dash"></div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Search by ID or title…">
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="not-started">Not started</option>
        <option value="in-progress">In progress</option>
        <option value="implemented">Implemented</option>
        <option value="not-applicable">Not applicable</option>
      </select>
      <button class="action secondary" id="exportCsv" type="button">Export CSV</button>
      <button class="action" id="printReport" type="button">Print report</button>
    </div>

    <div class="theme-rail" id="themeRail"></div>

    <div class="register" id="register"></div>
  </div>

  <div id="page-builder" style="display:none;"></div>

  <div id="page-fieldguide" style="display:none;"></div>

  <footer class="appfoot">
    <div class="appfoot-row">
      <span>Data is stored only in this browser. Nothing here is sent anywhere.</span>
      <span class="appfoot-actions">
        <button class="action secondary" id="backupBtn" type="button">Download backup</button>
        <button class="action secondary" id="restoreBtn" type="button">Restore backup</button>
        <input type="file" id="restoreFile" accept=".json" style="display:none;">
      </span>
    </div>
  </footer>
</div>

urity in the ICT supply chain", "desc": "Risk from sub-suppliers and the technology supply chain is managed.", "guidance": "Check whether supplier assessments extend to their own key suppliers.", "domain": "Supplier / Third-Party Management"}, {"id": "5.22", "theme": "Organizational", "title": "Monitoring, review and change management of supplier services", "desc": "Supplier performance and changes are tracked over the relationship.", "guidance": "Look for periodic supplier review meetings or scorecards.", "domain": "Supplier / Third-Party Management"}, {"id": "5.23", "theme": "Organizational", "title": "Information security for use of cloud services", "desc": "Cloud use follows defined security requirements.", "guidance": "Check a cloud security policy and shared-responsibility understanding for key services.", "domain": "Supplier / Third-Party Management"}, {"id": "5.24", "theme": "Organizational", "title": "Information security incident management planning and preparation", "desc": "Roles, procedures and tools for handling incidents are defined in advance.", "guidance": "Locate the incident response plan and its last test/tabletop date.", "domain": "Incident Response"}, {"id": "5.25", "theme": "Organizational", "title": "Assessment and decision on information security events", "desc": "Events are triaged to decide if they are incidents.", "guidance": "Check triage criteria and an example logged decision.", "domain": "Incident Response"}, {"id": "5.26", "theme": "Organizational", "title": "Response to information security incidents", "desc": "A documented process is followed to contain and resolve incidents.", "guidance": "Review a closed incident ticket for the steps taken.", "domain": "Incident Response"}, {"id": "5.27", "theme": "Organizational", "title": "Learning from information security incidents", "desc": "Lessons from incidents feed back into controls.", "guidance": "Look for a post-incident review with follow-up actions.", "domain": "Incident Response"}, {"id": "5.28", "theme": "Organizational", "title": "Collection of evidence", "desc": "Evidence from incidents is captured in a way that holds up later.", "guidance": "Check chain-of-custody procedures for incident evidence.", "domain": "Incident Response"}, {"id": "5.29", "theme": "Organizational", "title": "Information security during disruption", "desc": "Security is maintained during outages or business disruption.", "guidance": "Check whether the BCP/DRP addresses security continuity, not just availability.", "domain": "Business Continuity & Disaster Recovery"}, {"id": "5.30", "theme": "Organizational", "title": "ICT readiness for business continuity", "desc": "ICT systems and plans support the required continuity level.", "guidance": "Check DR test results against recovery time objectives.", "domain": "Business Continuity & Disaster Recovery"}, {"id": "5.31", "theme": "Organizational", "title": "Legal, statutory, regulatory and contractual requirements", "desc": "Applicable legal/regulatory obligations are identified and tracked.", "guidance": "Pull the compliance obligations register.", "domain": "Compliance, Audit & Legal"}, {"id": "5.32", "theme": "Organizational", "title": "Intellectual property rights", "desc": "IP rights (yours and third parties') are respected and protected.", "guidance": "Check software licensing records and IP-related contract clauses.", "domain": "Compliance, Audit & Legal"}, {"id": "5.33", "theme": "Organizational", "title": "Protection of records", "desc": "Records are protected from loss, tampering and unauthorized access per retention needs.", "guidance": "Check the records retention schedule and storage protections.", "domain": "Compliance, Audit & Legal"}, {"id": "5.34", "theme": "Organizational", "title": "Privacy and protection of PII", "desc": "PII is identified and handled per applicable privacy law.", "guidance": "Cross-reference with a data map or PIA for personal information flows.", "domain": "Privacy Rights & Transpare ned to avoid disrupting operations.", "guidance": "Check audit test plans for agreed scope and safeguards.", "domain": "Compliance, Audit & Legal"}]}, "pipeda": {"name": "PIPEDA \u2014 10 Fair Information Principles", "controls": [{"id": "1", "theme": "Fair Information Principles", "title": "Accountability", "desc": "The organization is responsible for personal information under its control and must designate someone accountable for compliance.", "guidance": "Confirm a named privacy officer/DPO and documented accountability.", "domain": "Governance & Policy"}, {"id": "2", "theme": "Fair Information Principles", "title": "Identifying Purposes", "desc": "Purposes for collecting personal information are identified at or before collection.", "guidance": "Check that collection notices state why data is collected.", "domain": "Privacy Rights & Transparency"}, {"id": "3", "theme": "Fair Information Principles", "title": "Consent", "desc": "Knowledge and consent are required for the collection, use, or disclosure of personal information, except in limited cases.", "guidance": "Check consent language and mechanism at each collection point.", "domain": "Privacy Rights & Transparency"}, {"id": "4", "theme": "Fair Information Principles", "title": "Limiting Collection", "desc": "Collection is limited to what is necessary for the identified purposes.", "guidance": "Compare fields collected against the stated purpose for a key form/system.", "domain": "Data Minimization & Processing Limits"}, {"id": "5", "theme": "Fair Information Principles", "title": "Limiting Use, Disclosure, and Retention", "desc": "Personal information is used or disclosed only for the purposes for which it was collected, and retained only as long as needed.", "guidance": "Check the retention schedule and use/disclosure logs.", "domain": "Data Minimization & Processing Limits"}, {"id": "6", "theme": "Fair Information Principles", "title": "Accuracy", "desc": "Personal information must be as accurate, complet <script>
(function() {
  const DATA = JSON.parse(document.getElementById('framework-data').textContent);
  const FW_KEYS = Object.keys(DATA);
  const FW_BADGE = { 'iso27001': 'ISO', 'pipeda': 'PIPEDA', 'nist-privacy': 'NIST', 'itsg33': 'ITSG-33' };

  let currentFw = FW_KEYS[0];
  let blendMode = false;
  let blendFws = FW_KEYS.slice();
  let currentGroupFilter = '';
  let currentStatusFilter = '';
  let currentSearch = '';
  let openRow = null;

  function activeFws() { return blendMode ? blendFws : [currentFw]; }
  function rowKey(fw, id) { return fw + '::' + id; }

  function storageKey(fw) { return 'control-register:' + fw; }

  function loadState(fw) {
    try {
      const raw = localStorage.getItem(storageKey(fw));
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function saveState(fw, state) {
    try { localStorage.setItem(storageKey(fw), JSON.stringify(state)); } catch (e) {}
  }

  function getEntry(fw, id) {
    const state = loadState(fw);
    return state[id] || { status: 'not-started', notes: '', evidence: '', reviewed: '' };
  }
  function setEntry(fw, id, patch) {
    const state = loadState(fw);
    state[id] = Object.assign({ status: 'not-started', notes: '', evidence: '', reviewed: '' }, state[id] || {}, patch);
    saveState(fw, state);
    return state[id];
  }

  function statusLabel(s) {
    return { 'not-started': 'Not started', 'in-progress': 'In progress', 'implemented': 'Implemented', 'not-applicable': 'Not applicable' }[s] || s;
  }

  function allItems() {
    const items = [];
    activeFws().forEach(function(fw) {
      DATA[fw].controls.forEach(function(c) { items.push({ fw: fw, control: c }); });
    });
    return items;
  }

  function groupOf(item) { return blendMode ? item.control.domain : item.control.theme; }

  function renderFwBar() {
    const bar = document.getElementById('fwBar');
    bar.innerHTML = '';
    FW_KEYS.forEach(function(key) {
      const btn = document.createElement('button');
      const isActive = blendMode ? blendFws.indexOf(key) !== -1 : key === currentFw;
      btn.className = 'fw-tab' + (isActive ? ' active' : '');
      btn.textContent = DATA[key].name;
      btn.type = 'button';
      btn.addEventListener('click', function() {
        if (blendMode) {
          if (blendFws.indexOf(key) !== -1) {
            if (blendFws.length > 1) blendFws = blendFws.filter(function(k) { return k !== key; });
          } else {
            blendFws.push(key);
          }
        } else {
          currentFw = key;
        }
        currentGroupFilter = '';
        currentSearch = '';
        currentStatusFilter = '';
        document.getElementById('search').value = '';
        document.getElementById('statusFilter').value = '';
        openRow = null;
        renderAll();
      });
      bar.appendChild(btn);
    });
    const blendBtn = document.createElement('button');
    blendBtn.className = 'theme-toggle';
    blendBtn.style.marginLeft = 'auto';
    blendBtn.type = 'button';
    blendBtn.textContent = blendMode ? '✓ Blending frameworks' : '🔀 Blend frameworks';
    blendBtn.addEventListener('click', function() {
      blendMode = !blendMode;
      if (blendMode && blendFws.length === 0) blendFws = FW_KEYS.slice();
      currentGroupFilter = ''; currentSearch = ''; currentStatusFilter = ''; openRow = null;
      document.getElementById('search').value = '';
      document.getElementById('statusFilter').value = '';
      renderAll();
    });
    bar.appendChild(blendBtn);
  }

  function renderDash() {
    const items = allItems();
    const counts = { 'not-started': 0, 'in-progress': 0, 'implemented': 0, 'not-applicable': 0 };
    items.forEach(function(item) {
      const entry = getEntry(item.fw, item.control.id);
      counts[entry.status]++;
    });
    const total = items.length;
    const applicable = total - counts['not-applicable'];
    const pct = applicable > 0 ? Math.round((counts['implemented'] / applicable) * 100) : 0;
    const dash = document.getElementById('dash');
    dash.innerHTML =
      '<div class="dash-cell met"><span class="num">' + pct + '%</span><span class="lbl">Implemented</span></div>' +
      '<div class="dash-cell"><span class="num">' + counts['in-progress'] + '</span><span class="lbl">In progress</span></div>' +
      '<div class="dash-cell gap"><span class="num">' + counts['not-started'] + '</span><span class="lbl">Not started</span></div>' +
      '<div class="dash-cell"><span class="num">' + total + '</span><span class="lbl">' + (blendMode ? 'Blended controls' : 'Total controls') + '</span></div>';
  }

  function renderThemeRail() {
    const items = allItems();
    const groups = [];
    items.forEach(function(item) { const g = groupOf(item); if (groups.indexOf(g) === -1) groups.push(g); });
    groups.sort();
    const rail = document.getElementById('themeRail');
    rail.innerHTML = '';
    const allChip = document.createElement('button');
    allChip.className = 'theme-chip' + (currentGroupFilter === '' ? ' active' : '');
    allChip.textContent = blendMode ? 'All domains' : 'All domains';
    allChip.type = 'button';
    allChip.addEventListener('click', function() { currentGroupFilter = ''; renderRegister(); renderThemeRail(); });
    rail.appendChild(allChip);
    groups.forEach(function(g) {
      const chip = document.createElement('button');
      chip.className = 'theme-chip' + (currentGroupFilter === g ? ' active' : '');
      chip.textContent = g;
      chip.type = 'button';
      chip.addEventListener('click', function() { currentGroupFilter = g; renderRegister(); renderThemeRail(); });
      rail.appendChild(chip);
    });
  }

  function matches(item) {
    if (currentGroupFilter && groupOf(item) !== currentGroupFilter) return false;
    const entry = getEntry(item.fw, item.control.id);
    if (currentStatusFilter && entry.status !== currentStatusFilter) return false;
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      const c = item.control;
      if (c.id.toLowerCase().indexOf(q) === -1 && c.title.toLowerCase().indexOf(q) === -1) return false;
    }
    return true;
  }

  function renderRegister() {
    const items = allItems().filter(matches);
    const wrap = document.getElementById('register');
    wrap.innerHTML = '';
    if (items.length === 0) {
      const empty = document.createElement('p');
      empty.style.color = 'var(--steel)';
      empty.style.padding = '24px 4px';
      empty.textContent = 'No controls match this filter.';
      wrap.appendChild(empty);
      return;
    }
    items.forEach(function(item) {
      const c = item.control, fw = item.fw;
      const key = rowKey(fw, c.id);
      const entry = getEntry(fw, c.id);
      const row = document.createElement('div');
      row.className = 'row ' + entry.status + (openRow === key ? ' open' : '');
      const badge = blendMode ? '<span class="fw-badge ' + fw + '">' + FW_BADGE[fw] + '</span>' : '';
      const groupLabel = blendMode ? c.domain : c.theme;
      row.innerHTML =
        '<div class="cid">' + c.id + '</div>' +
        '<div class="ctitle">' + badge + c.title + '<span class="theme-label">' + groupLabel + '</span></div>' +
        '<div class="status-pill ' + entry.status + '">' + statusLabel(entry.status) + '</div>' +
        '<div class="chev">›</div>';
      row.addEventListener('click', function() {
        openRow = (openRow === key) ? null : key;
        renderRegister();
      });
      wrap.appendChild(row);

      const detail = document.createElement('div');
      detail.className = 'detail' + (openRow === key ? ' open' : '');
      if (openRow === key) {
        detail.innerHTML = buildDetailHtml(c, entry, fw);
      }
      wrap.appendChild(detail);
      if (openRow === key) wireDetail(detail, fw, c.id);
    });
  }

  function buildDetailHtml(c, entry, fw) {
    return '<div class="detail-inner">' +
      (blendMode ? '<p style="font-size:11.5px;color:var(--steel);margin:-2px 0 8px;">' + DATA[fw].name + '</p>' : '') +
      '<p class="desc">' + c.desc + '</p>' +
      '<p class="guidance">' + c.guidance + '</p>' +
      '<div class="field-row">' +
        '<div class="field"><label>Status</label>' +
          '<select data-field="status">' +
            ['not-started','in-progress','implemented','not-applicable'].map(function(s) {
              return '<option value="' + s + '"' + (entry.status === s ? ' selected' : '') + '>' + statusLabel(s) + '</option>';
            }).join('') +
          '</select>' +
        '</div>' +
        '<div class="field"><label>Last reviewed</label>' +
          '<input type="date" data-field="reviewed" value="' + (entry.reviewed || '') + '">' +
        '</div>' +
      '</div>' +
      '<div class="field" style="margin-bottom:14px;">' +
        '<label>Notes</label>' +
        '<textarea data-field="notes" placeholder="What did you find? What still needs to happen?">' + escapeHtml(entry.notes || '') + '</textarea>' +
      '</div>' +
      '<div class="field">' +
        '<label>Evidence (links, file names, ticket refs)</label>' +
        '<textarea data-field="evidence" placeholder="e.g. policy doc link, screenshot filename, ticket #">' + escapeHtml(entry.evidence || '') + '</textarea>' +
      '</div>' +
      '<span class="saved-tick" data-tick>Saved</span>' +
    '</div>';
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function wireDetail(detail, fw, id) {
    const tick = detail.querySelector('[data-tick]');
    function showTick() {
      tick.classList.add('show');
      setTimeout(function() { tick.classList.remove('show'); }, 900);
    }
    detail.querySelectorAll('[data-field]').forEach(function(el) {
      const evt = (el.tagName === 'SELECT' || el.type === 'date') ? 'change' : 'input';
      el.addEventListener(evt, function() {
        const field = el.getAttribute('data-field');
        const patch = {};
        patch[field] = el.value;
        setEntry(fw, id, patch);
        showTick();
        if (field === 'status') { renderDash(); renderRegister(); }
      });
      el.addEventListener('click', function(e) { e.stopPropagation(); });
    });
    detail.addEventListener('click', function(e) { e.stopPropagation(); });
  }

  function toCsv() {
    const items = allItems();
    const rows = [['Framework','ID','Domain','Title','Status','Last Reviewed','Notes','Evidence']];
    items.forEach(function(item) {
      const c = item.control, fw = item.fw;
      const e = getEntry(fw, c.id);
      rows.push([DATA[fw].name, c.id, blendMode ? c.domain : c.theme, c.title, statusLabel(e.status), e.reviewed || '', e.notes || '', e.evidence || '']);
    });
    return rows.map(function(r) {
      return r.map(function(v) {
        const s = String(v).replace(/"/g, '""');
        return '"' + s + '"';
      }).join(',');
    }).join('\n');
  }

  document.getElementById('exportCsv').addEventListener('click', function() {
    const csv = toCsv();
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = (blendMode ? 'blended-audit' : currentFw) + '-export.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('printReport').addEventListener('click', function() {
    const items = allItems().filter(matches);
    const wrap = document.getElementById('register');
    wrap.innerHTML = '';
    items.forEach(function(item) {
      const c = item.control, fw = item.fw;
      const entry = getEntry(fw, c.id);
      const row = document.createElement('div');
      row.className = 'row ' + entry.status;
      const badge = blendMode ? '<span class="fw-badge ' + fw + '">' + FW_BADGE[fw] + '</span>' : '';
      row.innerHTML =
        '<div class="cid">' + c.id + '</div>' +
        '<div class="ctitle">' + badge + c.title + '<span class="theme-label">' + (blendMode ? c.domain : c.theme) + '</span></div>' +
        '<div class="status-pill ' + entry.status + '">' + statusLabel(entry.status) + '</div><div></div>';
      wrap.appendChild(row);
      const detail = document.createElement('div');
      detail.className = 'detail open';
      detail.innerHTML = '<div class="detail-inner">' +
        (blendMode ? '<p style="font-size:11.5px;color:var(--steel);">' + DATA[fw].name + '</p>' : '') +
        '<p class="desc">' + c.desc + '</p>' +
        '<p style="font-size:12.5px;"><strong>Notes:</strong> ' + escapeHtml(entry.notes || '—') + '</p>' +
        '<p style="font-size:12.5px;"><strong>Evidence:</strong> ' + escapeHtml(entry.evidence || '—') + '</p>' +
        '<p style="font-size:12.5px;"><strong>Last reviewed:</strong> ' + (entry.reviewed || '—') + '</p></div>';
      wrap.appendChild(detail);
    });
    window.print();
    setTimeout(function() { openRow = null; renderRegister(); }, 300);
  });

  document.getElementById('search').addEventListener('input', function(e) {
    currentSearch = e.target.value;
    renderRegister();
  });
  document.getElementById('statusFilter').addEventListener('change', function(e) {
    currentStatusFilter = e.target.value;
    renderRegister();
  });

  document.getElementById('themeToggle').addEventListener('click', function() {
    const root = document.documentElement;
    const current = root.getAttribute('data-theme');
    if (current === 'dark') { root.setAttribute('data-theme', 'light'); this.textContent = 'Dark mode'; }
    else { root.setAttribute('data-theme', 'dark'); this.textContent = 'Light mode'; }
  });

  const BACKUP_PREFIXES = ['control-register:', 'grc-doc:', 'grc-template:'];
  const BACKUP_EXACT_KEYS = ['grc-fieldguide-progress'];

  function collectBackup() {
    const data = {};
    Object.keys(localStorage).forEach(function(k) {
      const matchesPrefix = BACKUP_PREFIXES.some(function(p) { return k.indexOf(p) === 0; });
      if (matchesPrefix || BACKUP_EXACT_KEYS.indexOf(k) !== -1) {
        data[k] = localStorage.getItem(k);
      }
    });
    return { app: 'control-register', exportedAt: new Date().toISOString(), data: data };
  }

  document.getElementById('backupBtn').addEventListener('click', function() {
    const backup = collectBackup();
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'control-register-backup-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('restoreBtn').addEventListener('click', function() {
    document.getElementById('restoreFile').click();
  });

  document.getElementById('restoreFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (!confirm('Restoring will overwrite any current data in this browser with the contents of the backup file. Continue?')) {
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = function() {
      try {
        const parsed = JSON.parse(reader.result);
        const data = parsed && parsed.data ? parsed.data : parsed;
        Object.keys(data).forEach(function(k) { localStorage.setItem(k, data[k]); });
        alert('Backup restored. Reloading…');
        location.reload();
      } catch (err) {
        alert("Couldn't read that file — make sure it's a backup exported from this tool.");
      }
    };
    reader.readAsText(file);
  });

  function renderAll() {
    renderFwBar();
    renderDash();
    renderThemeRail();
    renderRegister();
  }

  renderAll();

  document.getElementById('pageNav').addEventListener('click', function(e) {
    const btn = e.target.closest('button[data-page]');
    if (!btn) return;
    const page = btn.getAttribute('data-page');
    const pages = ['register', 'builder', 'fieldguide'];
    document.querySelectorAll('#pageNav button').forEach(function(b) { b.classList.toggle('active', b === btn); });
    pages.forEach(function(p) { document.getElementById('page-' + p).style.display = (p === page) ? '' : 'none'; });
    if (page === 'builder' && window.GRCBuilder) window.GRCBuilder.init();
    if (page === 'fieldguide' && window.GRCFieldGuide) window.GRCFieldGuide.init();
  });
})();
</script>

  function loadAnswers(id) {
    try { const raw = localStorage.getItem(docKey(id)); return raw ? JSON.parse(raw).answers || {} : {}; } catch (e) { return {}; }
  }
  function saveAnswers(id, answers) {
    try { localStorage.setItem(docKey(id), JSON.stringify({ answers: answers, updated: new Date().toISOString() })); } catch (e) {}
  }
  function loadMeta(id) {
    try { const raw = localStorage.getItem(docKey(id)); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function loadTemplate(dt) {
    try { const raw = localStorage.getItem(tplKey(dt.id)); return raw !== null ? raw : dt.template; } catch (e) { return dt.template; }
  }
  function saveTemplate(id, text) { try { localStorage.setItem(tplKey(id), text); } catch (e) {} }
  function resetTemplate(id) { try { localStorage.removeItem(tplKey(id)); } catch (e) {} }

  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function mdEscape(s) { return String(s == null ? '' : s).replace(/\|/g, '\\|').replace(/\n/g, ' '); }

  function tableToMarkdown(columns, rows) {
    if (!rows || rows.length === 0) return '_(none recorded)_';
    const header = '| ' + columns.map(function(c) { return c.label; }).join(' | ') + ' |';
    const sep = '| ' + columns.map(function() { return '---'; }).join(' | ') + ' |';
    const body = rows.map(function(r) {
      return '| ' + columns.map(function(c) { return mdEscape(r[c.id] || ''); }).join(' | ') + ' |';
    }).join('\n');
    return header + '\n' + sep + '\n' + body;
  }

  function riskTableToMarkdown(rows) {
    const cols = [
      { id: 'asset', label: 'Asset' }, { id: 'threat', label: 'Threat / Vulnerability' },
      { id: 'likelihood', label: 'Likelihood' }, { id: 'impact', label: 'Impact' },
      { id: 'score', label: 'Score' }, { id: 'level', label: 'Level' },
      { id: 'controls', label: 'Existing Controls' }, { id: 'owner', label: 'Owner' }, { id: 'treatment', label: 'Treatment' }
    ];
    const enriched = (rows || []).map(function(r) {
      const l = parseFloat(r.likelihood) || 0, i = parseFloat(r.impact) || 0;
      const score = l * i;
      const level = score >= 15 ? 'High' : score >= 8 ? 'Medium' : (score > 0 ? 'Low' : '');
      return Object.assign({}, r, { score: score || '', level: level });
    });
    return tableToMarkdown(cols, enriched);
  }

  function getSoaControlData() {
    let controls = [];
    try {
      const dataScript = document.getElementById('framework-data');
      const DATA = JSON.parse(dataScript.textContent);
      controls = DATA.iso27001.controls;
    } catch (e) { controls = []; }
    let regState = {};
    try { regState = JSON.parse(localStorage.getItem('control-register:iso27001') || '{}'); } catch (e) {}
    return { controls: controls, regState: regState };
  }

  function soaTableToMarkdown(answers) {
    const { controls, regState } = getSoaControlData();
    const overrides = answers.soaOverrides || {};
    const cols = [
      { id: 'id', label: 'ID' }, { id: 'title', label: 'Control' }, { id: 'applicable', label: 'Applicable' },
      { id: 'status', label: 'Implementation Status' }, { id: 'justification', label: 'Justification' }
    ];
    const rows = controls.map(function(c) {
      const ov = overrides[c.id] || {};
      const regEntry = regState[c.id] || {};
      const applicable = ov.applicable || (regEntry.status === 'not-applicable' ? 'no' : 'yes');
      const justification = ov.justification || (regEntry.status === 'not-applicable' ? (regEntry.notes || '') : '');
      return {
        id: c.id, title: c.title,
        applicable: applicable === 'no' ? 'No' : 'Yes',
        status: applicable === 'no' ? 'Excluded' : (({ 'not-started': 'Not started', 'in-progress': 'In progress', 'implemented': 'Implemented' })[regEntry.status] || 'Not started'),
        justification: applicable === 'no' ? (justification || '_(justification needed)_') : ''
      };
    });
    return tableToMarkdown(cols, rows);
  }

  function compile(dt, answers) {
    let tpl = loadTemplate(dt);
    tpl = tpl.replace(/\{\{table:(\w+)\}\}/g, function(_, fieldId) {
      if (dt.special === 'soa' && fieldId === 'soaControls') return soaTableToMarkdown(answers);
      if (dt.id === 'risk-register' && fieldId === 'risks') return riskTableToMarkdown((answers[fieldId] || {}).rows || answers[fieldId] || []);
      const field = dt.sections.reduce(function(acc, s) { return acc || s.fields && s.fields.find(function(f) { return f.id === fieldId; }); }, null);
      const rows = (answers[fieldId] || {}).rows || answers[fieldId] || [];
      const columns = field ? field.columns : [];
      return tableToMarkdown(columns || [], rows);
    });
    tpl = tpl.replace(/\{\{(\w+)\}\}/g, function(_, key) {
      const v = answers[key];
      return (v === undefined || v === null || v === '') ? '_(not provided)_' : esc(v).replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
    });
    return tpl;
  }

  function mdToHtml(md) {
    const lines = md.split('\n');
    let html = ''; let i = 0; let inTable = false; let tableRows = [];
    function flushTable() {
      if (!tableRows.length) return;
      const header = tableRows[0];
      const body = tableRows.slice(2);
      html += '<table><thead><tr>' + header.map(function(h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>';
      body.forEach(function(r) { html += '<tr>' + r.map(function(c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; });
      html += '</tbody></table>';
      tableRows = []; inTable = false;
    }
    for (i = 0; i < lines.length; i++) {
      let line = lines[i];
      if (/^\|/.test(line)) {
        inTable = true;
        tableRows.push(line.trim().replace(/^\||\|$/g, '').split('|').map(function(c) { return c.trim(); }));
        continue;
      } else if (inTable) { flushTable(); }
      line = line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      if (/^# /.test(line)) html += '<h1>' + line.slice(2) + '</h1>';
      else if (/^## /.test(line)) html += '<h2>' + line.slice(3) + '</h2>';
      else if (line.trim() === '') html += '';
      else html += '<p>' + line + '</p>';
    }
    if (inTable) flushTable();
    return html;
  }

  function render() {
    const root = document.getElementById('page-builder');
    if (state.view === 'grid') { root.innerHTML = renderGrid(); wireGrid(); }
    else if (state.view === 'wizard') { root.innerHTML = renderWizard(); wireWizard(); }
    else if (state.view === 'preview') { root.innerHTML = renderPreview(); wirePreview(); }
  }

  function renderGrid() {
    let html = '<div class="doctype-grid">';
    DOC_TYPES.forEach(function(dt) {
      const meta = loadMeta(dt.id);
      html += '<div class="doctype-card" data-id="' + dt.id + '">' +
        '<span class="dt-tag">' + dt.tag + '</span>' +
        '<h3>' + dt.name + '</h3>' +
        '<p>' + dt.description + '</p>' +
        (meta ? '<span class="dt-status">Draft saved — continue</span>' : '') +
        '</div>';
    });
    html += '</div>';
    return html;
  }

  function wireGrid() {
    document.querySelectorAll('.doctype-card').forEach(function(card) {
      card.addEventListener('click', function() {
        const dt = DOC_TYPES.find(function(d) { return d.id === card.getAttribute('data-id'); });
        state.docType = dt; state.sectionIndex = 0; state.view = 'wizard';
        render();
      });
    });
  }

  function fieldValue(answers, fieldId, sub) {
    if (sub) return ((answers[fieldId] || {})[sub]);
    return answers[fieldId];
  }

  function renderFieldRows(rows, columns) {
    return (rows || []).map(function(r, idx) {
      return '<tr data-row="' + idx + '">' + columns.map(function(c) {
        if (c.type === 'select') {
          return '<td><select data-col="' + c.id + '">' + c.options.map(function(o) {
            return '<option' + (r[c.id] === o ? ' selected' : '') + '>' + o + '</option>';
          }).join('') + '</select></td>';
        }
        return '<td><input type="text" data-col="' + c.id + '" value="' + esc(r[c.id] || '') + '"></td>';
      }).join('') + '<td><button class="rm-row" data-row="' + idx + '" type="button">×</button></td></tr>';
    }).join('');
  }

  function renderWizard() {
    const dt = state.docType;
    const section = dt.sections[state.sectionIndex];
    const answers = loadAnswers(dt.id);
    const total = dt.sections.length;
    let fieldsHtml = '';

    if (section.special === 'soa-table') {
      const { controls, regState } = getSoaControlData();
      const overrides = answers.soaOverrides || {};
      fieldsHtml += '<p style="font-size:12.5px;color:var(--steel);margin-bottom:12px;">Pulled from your Control Register. Mark a control ' +
        '<strong>No</strong> to exclude it and give a justification — everything else is included by default.</p>';
      fieldsHtml += '<div class="soa-table-wrap" id="soaWrap">';
      controls.forEach(function(c) {
        const ov = overrides[c.id] || {};
        const regEntry = regState[c.id] || {};
        const applicable = ov.applicable || (regEntry.status === 'not-applicable' ? 'no' : 'yes');
        const justification = ov.justification !== undefined ? ov.justification : (regEntry.status === 'not-applicable' ? (regEntry.notes || '') : '');
        fieldsHtml += '<div class="soa-row" data-cid="' + c.id + '">' +
          '<div class="soa-id">' + c.id + '</div>' +
          '<div class="soa-title">' + c.title + '</div>' +
          '<select data-soa-applicable>' +
            '<option value="yes"' + (applicable === 'yes' ? ' selected' : '') + '>Yes</option>' +
            '<option value="no"' + (applicable === 'no' ? ' selected' : '') + '>No</option>' +
          '</select>' +
          '<textarea data-soa-justification placeholder="Justification (if excluded)" style="' + (applicable === 'no' ? '' : 'visibility:hidden;') + '">' + esc(justification) + '</textarea>' +
        '</div>';
      });
      fieldsHtml += '</div>';
    } else {
      section.fields.forEach(function(f) {
        fieldsHtml += '<div class="w-field" data-field="' + f.id + '">';
        fieldsHtml += '<label>' + f.label + '</label>';
        if (f.type === 'textarea') {
          fieldsHtml += '<textarea data-answer="' + f.id + '">' + esc(answers[f.id] || '') + '</textarea>';
        } else if (f.type === 'select') {
          fieldsHtml += '<select data-answer="' + f.id + '">' + f.options.map(function(o) {
            return '<option' + (answers[f.id] === o ? ' selected' : '') + '>' + o + '</option>';
          }).join('') + '</select>';
        } else if (f.type === 'date') {
          fieldsHtml += '<input type="date" data-answer="' + f.id + '" value="' + esc(answers[f.id] || '') + '">';
        } else if (f.type === 'table') {
          const rows = (answers[f.id] || {}).rows || answers[f.id] || [];
          fieldsHtml += '<table class="w-table" data-table="' + f.id + '"><thead><tr>' +
            f.columns.map(function(c) { return '<th>' + c.label + '</th>'; }).join('') + '<th></th></tr></thead>' +
            '<tbody>' + renderFieldRows(rows, f.columns) + '</tbody></table>' +
            '<button class="w-add-row" data-add-row="' + f.id + '" type="button">+ Add row</button>';
        } else {
          fieldsHtml += '<input type="text" data-answer="' + f.id + '" value="' + esc(answers[f.id] || '') + '">';
        }
        fieldsHtml += '</div>';
      });
    }

    return '<div class="wizard-head">' +
      '<button class="back-link" id="backToGrid" type="button">‹ All documents</button>' +
      '<h2>' + dt.name + '</h2>' +
      '<div class="wizard-progress">Section ' + (state.sectionIndex + 1) + ' of ' + total + ' — ' + section.title + '</div>' +
      '</div>' +
      '<div class="wizard-bar"><div class="wizard-bar-fill" style="width:' + Math.round(((state.sectionIndex) / total) * 100) + '%"></div></div>' +
      '<div class="wizard-section"><h3>' + section.title + '</h3>' + fieldsHtml + '</div>' +
      '<div class="wizard-nav-buttons">' +
        '<button class="btn-ghost" id="wizBack" type="button"' + (state.sectionIndex === 0 ? ' style="visibility:hidden;"' : '') + '>Back</button>' +
        '<button class="btn-primary" id="wizNext" type="button">' + (state.sectionIndex === total - 1 ? 'Preview document' : 'Next') + '</button>' +
      '</div>';
  }

  function currentAnswers() { return loadAnswers(state.docType.id); }

  function wireWizard() {
    const dt = state.docType;
    document.getElementById('backToGrid').addEventListener('click', function() { state.view = 'grid'; render(); });

    document.querySelectorAll('[data-answer]').forEach(function(el) {
      const evt = (el.tagName === 'SELECT' || el.type === 'date') ? 'change' : 'input';
      el.addEventListener(evt, function() {
        const answers = currentAnswers();
        answers[el.getAttribute('data-answer')] = el.value;
        saveAnswers(dt.id, answers);
      });
    });

    document.querySelectorAll('[data-table]').forEach(function(tableEl) {
      const fieldId = tableEl.getAttribute('data-table');
      tableEl.querySelectorAll('input, select').forEach(function(cell) {
        cell.addEventListener('input', syncTable);
        cell.addEventListener('change', syncTable);
      });
      function syncTable() {
        const answers = currentAnswers();
        const rows = [];
        tableEl.querySelectorAll('tbody tr').forEach(function(tr) {
          const row = {};
          tr.querySelectorAll('[data-col]').forEach(function(inp) { row[inp.getAttribute('data-col')] = inp.value; });
          rows.push(row);
        });
        answers[fieldId] = rows;
        saveAnswers(dt.id, answers);
      }
      tableEl.querySelectorAll('.rm-row').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const answers = currentAnswers();
          const rows = (answers[fieldId] || []);
          rows.splice(parseInt(btn.getAttribute('data-row'), 10), 1);
          answers[fieldId] = rows;
          saveAnswers(dt.id, answers);
          render();
        });
      });
    });

    document.querySelectorAll('[data-add-row]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const fieldId = btn.getAttribute('data-add-row');
        const answers = currentAnswers();
        const rows = answers[fieldId] || [];
        rows.push({});
        answers[fieldId] = rows;
        saveAnswers(dt.id, answers);
        render();
      });
    });

    const soaWrap = document.getElementById('soaWrap');
    if (soaWrap) {
      soaWrap.querySelectorAll('.soa-row').forEach(function(row) {
        const cid = row.getAttribute('data-cid');
        const sel = row.querySelector('[data-soa-applicable]');
        const txt = row.querySelector('[data-soa-justification]');
        sel.addEventListener('change', function() {
          txt.style.visibility = sel.value === 'no' ? 'visible' : 'hidden';
          const answers = currentAnswers();
          answers.soaOverrides = answers.soaOverrides || {};
          answers.soaOverrides[cid] = Object.assign({}, answers.soaOverrides[cid], { applicable: sel.value });
          saveAnswers(dt.id, answers);
        });
        txt.addEventListener('input', function() {
          const answers = currentAnswers();
          answers.soaOverrides = answers.soaOverrides || {};
          answers.soaOverrides[cid] = Object.assign({}, answers.soaOverrides[cid], { justification: txt.value });
          saveAnswers(dt.id, answers);
        });
      });
    }

    document.getElementById('wizBack').addEventListener('click', function() {
      state.sectionIndex = Math.max(0, state.sectionIndex - 1);
      render();
    });
    document.getElementById('wizNext').addEventListener('click', function() {
      if (state.sectionIndex < dt.sections.length - 1) { state.sectionIndex++; render(); }
      else { state.view = 'preview'; render(); }
    });
  }

  function renderPreview() {
    const dt = state.docType;
    const answers = currentAnswers();
    const md = compile(dt, answers);
    const html = mdToHtml(md);
    return '<div class="wizard-head">' +
      '<button class="back-link" id="backToWizard" type="button">‹ Edit answers</button>' +
      '<h2>' + dt.name + ' — Preview</h2>' +
      '</div>' +
      '<div class="preview-toolbar">' +
        '<button class="action secondary" id="editTemplate" type="button">Customize template</button>' +
        '<button class="action secondary" id="copyMd" type="button">Copy as Markdown</button>' +
        '<button class="action secondary" id="downloadMd" type="button">Download .md</button>' +
        '<button class="action" id="printDoc" type="button">Print / Save as PDF</button>' +
      '</div>' +
      '<div class="doc-preview" id="docPreview">' + html + '</div>' +
      '<div class="tpl-editor-wrap" id="tplEditorWrap" style="display:none;">' +
        '<h3 style="font-family:\'Fraunces\',serif;">Template</h3>' +
        '<p style="font-size:12.5px;color:var(--steel);">Edit the structure and wording below. Keep the tokens (in curly braces) where you want that answer to appear.</p>' +
        '<div class="tpl-tokens">' + availableTokens(dt) + '</div>' +
        '<textarea id="tplText">' + esc(loadTemplate(dt)) + '</textarea>' +
        '<div class="wizard-nav-buttons" style="border-top:none;">' +
          '<button class="btn-ghost" id="resetTpl" type="button">Reset to default</button>' +
          '<button class="btn-primary" id="saveTpl" type="button">Save & re-render</button>' +
        '</div>' +
      '</div>';
  }

  function availableTokens(dt) {
    const tokens = [];
    dt.sections.forEach(function(s) {
      if (s.special === 'soa-table') { tokens.push('{{table:soaControls}}'); return; }
      (s.fields || []).forEach(function(f) {
        tokens.push(f.type === 'table' ? '{{table:' + f.id + '}}' : '{{' + f.id + '}}');
      });
    });
    return tokens.map(function(t) { return '<span>' + t + '</span>'; }).join(' ');
  }

  function wirePreview() {
    const dt = state.docType;
    document.getElementById('backToWizard').addEventListener('click', function() {
      state.view = 'wizard'; state.sectionIndex = dt.sections.length - 1; render();
    });
    document.getElementById('editTemplate').addEventListener('click', function() {
      const wrap = document.getElementById('tplEditorWrap');
      wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
    });
    document.getElementById('saveTpl').addEventListener('click', function() {
      saveTemplate(dt.id, document.getElementById('tplText').value);
      render();
    });
    document.getElementById('resetTpl').addEventListener('click', function() {
      resetTemplate(dt.id); render();
    });
    document.getElementById('copyMd').addEventListener('click', function() {
      const md = compile(dt, currentAnswers());
      navigator.clipboard && navigator.clipboard.writeText(md).catch(function(){});
    });
    document.getElementById('downloadMd').addEventListener('click', function() {
      const md = compile(dt, currentAnswers());
      const blob = new Blob([md], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = dt.id + '.md';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
    document.getElementById('printDoc').addEventListener('click', function() { window.print(); });
  }

  window.GRCBuilder = { init: function() { render(); } };
})();
</script>
<script>
(function() {
  const TOPICS = [
    {
      id: 'what-is-auditing', title: 'What Auditing Actually Is', teaser: 'Audit vs. assessment, and the three parties who can perform one.',
      body: [
        "An audit is an independent, evidence-based check of whether something meets a defined set of requirements. That's different from an assessment (a broader look at risk or maturity, not always against a fixed standard) and a review (informal, often self-directed, with no independence requirement).",
        "Audits come in three flavors. A <strong>first-party</strong> audit is internal — your own organization checking itself, often to prepare for something bigger. A <strong>second-party</strong> audit is one your customer or a regulator performs on you. A <strong>third-party</strong> audit is performed by an independent, accredited body — this is what produces an ISO 27001 certificate.",
        "Auditors also distinguish <strong>assurance</strong> work (forming an opinion on whether something is true or compliant) from <strong>consulting</strong> work (giving advice or building something). The two are usually kept separate — someone who designed a control shouldn't be the one certifying it works later, which is part of why segregation of duties exists as a control in its own right."
      ],
      quiz: [
        { q: 'Which of these produces an ISO 27001 certificate?', options: ['First-party audit', 'Second-party audit', 'Third-party audit', 'Self-assessment'], correct: 2, explain: 'Only an accredited, independent third-party certification body can issue an ISO 27001 certificate.' },
        { q: "Your own compliance team checks its controls before an external audit. What type of audit is this?", options: ['First-party', 'Second-party', 'Third-party', 'Statutory'], correct: 0, explain: 'Checking your own organization internally is a first-party (internal) audit.' },
        { q: "Why shouldn't the person who designed a control also certify it's working?", options: ['It violates a law', 'It breaks independence / segregation of duties', 'It just takes too long', "It isn't required at all"], correct: 1, explain: 'Independence is core to assurance work — the same idea behind the Segregation of Duties control in your Register.' }
      ]
    },
    {
      id: 'control-basics', title: 'Control Basics: Design vs. Operating Effectiveness', teaser: 'Two different questions every control gets asked, plus the preventive/detective/corrective split.',
      body: [
        "Every control gets evaluated two different ways, and mixing them up is one of the most common beginner mistakes.",
        "A <strong>design test</strong> asks: if this control were followed exactly as written, would it actually address the risk? You can fail a design test even if nobody has done anything wrong yet — the control itself might be poorly conceived.",
        "An <strong>operating effectiveness test</strong> asks: is the control actually happening, consistently, in practice? A well-designed access review process that nobody has run in eight months fails on operating effectiveness, even though it would pass on design.",
        "Controls are also usually classified as <strong>preventive</strong> (stops a bad thing from happening — MFA, firewalls), <strong>detective</strong> (notices a bad thing after the fact — logging, monitoring), or <strong>corrective</strong> (fixes things after detection — incident response, patching). A mature environment layers all three, because no single type catches everything."
      ],
      quiz: [
        { q: 'A backup policy requires daily backups, but the last restore test was 14 months ago. This fails on:', options: ['Design', 'Operating effectiveness', 'Both', 'Neither'], correct: 1, explain: 'The policy itself may be fine (design) — the issue is whether it actually happens (operating effectiveness).' },
        { q: 'MFA on a login screen is an example of a:', options: ['Detective control', 'Corrective control', 'Preventive control', 'Compensating control'], correct: 2, explain: 'MFA stops unauthorized access before it happens — preventive.' },
        { q: 'Log monitoring that flags unusual login activity is best classified as:', options: ['Preventive', 'Detective', 'Corrective', 'Administrative'], correct: 1, explain: "Monitoring notices something after it's already happened — detective." }
      ]
    },
    {
      id: 'evidence-sampling', title: 'Evidence & Sampling', teaser: 'The evidence hierarchy, and how auditors choose what to sample.',
      body: [
        "Not all evidence carries the same weight. From weakest to strongest: <strong>inquiry</strong> (someone tells you it happens) is weakest on its own; <strong>observation</strong> (you watch it happen once) is stronger but only proves a single instance; <strong>inspection</strong> (you review documents, logs, or configurations) is stronger still because it's independently verifiable; <strong>re-performance</strong> (you redo the control yourself and get the same result) is strongest, because it doesn't rely on anyone's account at all.",
        "Good evidence is rarely a single interview. A notes field that says 'IT confirmed backups run daily' is weak; one that says 'reviewed backup logs for the last 90 days — 88/90 successful, two failures investigated and resolved' is strong.",
        "For controls that happen often, like access provisioning, auditors sample rather than check every instance — a handful of transactions chosen to cover different systems, requesters, and time periods, rather than all clustered in one month."
      ],
      quiz: [
        { q: 'Which type of evidence is generally considered strongest?', options: ['Inquiry', 'Observation', 'Inspection', 'Re-performance'], correct: 3, explain: "Re-performance doesn't rely on anyone's account — you get the same result independently." },
        { q: "'The IT manager told me access reviews happen quarterly' is an example of:", options: ['Re-performance', 'Inquiry', 'Inspection', 'Corroboration'], correct: 1, explain: 'An unverified statement is inquiry — the weakest form on its own.' },
        { q: 'When sampling provisioning tickets across a year, what should you avoid?', options: ['Choosing samples from only one month', 'Including different systems', 'Including different requesters', 'Documenting your sample method'], correct: 0, explain: 'Clustering samples in one period can miss issues that only show up at other times.' }
      ]
    },
    {
      id: 'writing-findings', title: 'Writing a Finding', teaser: "The 5 C's — Condition, Criteria, Cause, Effect, Recommendation — with a worked example.",
      body: [
        "A finding isn't just 'this is broken.' A well-written one has five parts: <strong>Condition</strong> (what you observed), <strong>Criteria</strong> (the standard or policy it should have met), <strong>Cause</strong> (why the gap exists, if known), <strong>Effect</strong> (the risk or impact that results), and <strong>Recommendation</strong> (what should change).",
        "Weak: 'Backups aren't being tested.'",
        "Strong: 'Condition — no restore test in 14 months. Criteria — policy requires quarterly testing. Cause — no owner assigned after a staff departure. Effect — undetected backup failures could mean unrecoverable data loss during an incident. Recommendation — assign restore-test ownership and schedule the next test within 30 days.'",
        "The strong version survives management pushback because it's specific, ties back to a stated requirement, and gives something actionable — rather than sounding like an opinion."
      ],
      quiz: [
        { q: "In the 5 C's, 'Criteria' refers to:", options: ['What you observed', 'The standard or requirement that should have been met', 'Why the problem happened', 'The fix being suggested'], correct: 1 },
        { q: 'Which part of a finding explains the risk if nothing changes?', options: ['Condition', 'Cause', 'Effect', 'Recommendation'], correct: 2 },
        { q: "'Backups aren't being tested' is weak mainly because it's missing:", options: ['A recommendation only', 'Specificity, a stated criteria, and impact', 'Correct grammar', 'A finding ID number'], correct: 1 }
      ]
    },
    {
      id: 'doc-hierarchy', title: 'The Documentation Hierarchy', teaser: 'Policy, Standard, Procedure, Guideline, Record — and where each one ends.',
      body: [
        "GRC documentation follows a pyramid, and mixing up the levels is a common source of confusion — and of findings in its own right.",
        "A <strong>Policy</strong> sits at the top — a short, management-approved statement of intent. It rarely changes and says <em>what</em>, not <em>how</em>.",
        "A <strong>Standard</strong> sets specific, measurable requirements that support a policy (e.g. 'passwords must be at least 14 characters'). More detailed than a policy, still not step-by-step.",
        "A <strong>Procedure</strong> (or SOP) is the step-by-step <em>how</em> — the exact clicks, approvals, and order someone follows to meet the standard.",
        "A <strong>Guideline</strong> is optional, recommended practice — helpful but not mandatory.",
        "A <strong>Record</strong> is the evidence a procedure was actually followed — a completed checklist, an approval email, a signed form.",
        "The Document Builder's templates map onto this: an Information Security Policy sits at the top; a Risk Register or Incident Response Plan sits closer to procedure level."
      ],
      quiz: [
        { q: "'Passwords must be 14+ characters, rotated every 180 days' is an example of a:", options: ['Policy', 'Standard', 'Procedure', 'Guideline'], correct: 1 },
        { q: 'Which level of documentation is mandatory to follow, not just recommended?', options: ['Guideline only', 'Standard and Procedure', 'Record only', 'None of them'], correct: 1 },
        { q: 'A signed access-request form proving access was approved is a:', options: ['Policy', 'Standard', 'Procedure', 'Record'], correct: 3 }
      ]
    },
    {
      id: 'iso-basics', title: 'ISO 27001 Management System Basics', teaser: 'Annex A is the smaller part — the PDCA cycle in clauses 4–10 is the rest.',
      body: [
        "ISO 27001 doesn't just list controls — Annex A is actually the smaller part. Clauses 4 through 10 define the management system that runs around those controls, built on the Plan-Do-Check-Act (PDCA) cycle.",
        "<strong>Plan</strong> (clauses 4–6): understand the organization's context, define scope, identify risks, and select controls — this is where the Statement of Applicability comes from.",
        "<strong>Do</strong> (clauses 7–8): put resources, competence, and the selected controls into operation.",
        "<strong>Check</strong> (clause 9): monitor, internally audit, and hold a management review to see if it's actually working.",
        "<strong>Act</strong> (clause 10): fix nonconformities and continually improve.",
        "This is why an ISO 27001 audit never just checks Annex A controls in isolation — an auditor also checks whether you're running the PDCA cycle itself: risk assessments, an internal audit program, management review minutes — not just firewalls and policies."
      ],
      quiz: [
        { q: 'Which clause range does the Statement of Applicability come from?', options: ['Clause 4', 'Clauses 4–6 (Plan)', 'Clause 9', 'Clause 10'], correct: 1 },
        { q: 'Management review and internal audit belong to which part of PDCA?', options: ['Plan', 'Do', 'Check', 'Act'], correct: 2 },
        { q: 'True or false: an ISO 27001 auditor only checks Annex A controls.', options: ['True', 'False'], correct: 1, explain: 'They also check the management system clauses — risk assessment, internal audit, management review, and continual improvement.' }
      ]

    {
      id: 'soa-reading', title: 'Reading a Statement of Applicability', teaser: 'Why "Not Applicable" is not the same thing as "not done yet."',
      body: [
        "A Statement of Applicability (SoA) is one of the most scrutinized documents in an ISO 27001 assessment, because it's the bridge between your risk assessment and your actual control set. For every Annex A control it records: whether it's applicable, whether it's implemented, and — critically — a justification for anything marked not applicable.",
        "'Not applicable' is not the same as 'not done yet.' An auditor expects a real justification tied to your context — excluding teleworking controls because the organization has no remote staff is legitimate; excluding vulnerability management because 'we haven't gotten to it' is not an exclusion at all — that's a gap, and belongs on the register as an open finding, not a No in the applicability column.",
        "This is exactly what the Document Builder's SoA generator enforces: it only asks for a justification when a control is marked No, because that's the only place one is actually required."
      ],
      quiz: [
        { q: "In an SoA, what's required for every control marked 'Not Applicable'?", options: ['Nothing', 'A justification tied to your context', 'A cost estimate', "A staff member's name"], correct: 1 },
        { q: 'Which is a legitimate reason to mark a control Not Applicable?', options: ["We haven't implemented it yet", 'We ran out of time before certification', "The control addresses a scenario that doesn't exist in this organization", 'The team disagrees with the control'], correct: 2 },
        { q: "A control that should be implemented but isn't yet should be marked in the SoA as:", options: ['Not Applicable, no justification needed', 'Applicable, with an open/gap status', 'Deleted from the SoA', 'Excluded pending budget'], correct: 1 }
